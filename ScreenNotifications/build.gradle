apply plugin: 'com.android.application'

android {
    namespace 'com.thevelvetalgo.screenwake'
    compileSdkVersion 34

    defaultConfig {
        applicationId 'com.thevelvetalgo.screenwake'
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
