name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew clean assembleDebug --stacktrace 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Push build log for inspection
        if: always()
        shell: bash
        run: |
          git config user.email "ci@example.com"
          git config user.name "CI Bot"
          git checkout -B ci-logs
          git add -f build.log
          git commit -m "CI build log [skip ci]" || true
          git push -f origin ci-logs

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: screen-wake-debug-apk
          path: ScreenNotifications/build/outputs/apk/debug/*.apk
